[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-dub"
version = "0.1.0"
description = "YouTube → translated dubbed video CLI (macOS-friendly)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "voice-pro macOS port" }]
license = { text = "GPL-3.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "edge-tts>=7",
    "faster-whisper>=1.1",
    "deep-translator>=1.11",
    "yt-dlp>=2026.3",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gpt = ["openai>=1.50"]

[project.scripts]
yt-dub = "yt_dub.cli:cli_entry"

[tool.hatch.build.targets.wheel]
packages = ["yt_dub"]
